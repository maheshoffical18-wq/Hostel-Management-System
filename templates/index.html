<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            color: #1f4e79;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 17px;
        }

        .btn:hover {
            background: #163a5c;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hostel Management System</h1>

        <p>Welcome to Hostel Management System</p>

        <a class="btn" href="/students">
            Student Management
        </a>

    </div>

</body>
</html>
